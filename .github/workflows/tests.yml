name: Rust tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Node for frontend and control contracts
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo +stable clippy --workspace --locked --all-targets -- -D warnings
      - name: Build runtime, desktop, agent and benchmark tools
        run: cargo +stable build --workspace --release --locked
      - name: Test collectors, agents and offline benchmark workflows
        env:
          FIELDKIT_TEST_BINARY: ${{ github.workspace }}/target/release/fieldkit
        run: cargo +stable test --workspace --locked
      - name: Browser workflow checks
        run: node tests/frontend_test.mjs
      - name: NVIDIA setup and compilation control contracts
        run: |
          sh -n integrations/auto-ontology/setup.sh
          node --test integrations/auto-ontology/bootstrap-token.test.mjs integrations/auto-ontology/semantic-control.test.mjs integrations/auto-ontology/setup-cleanup.test.mjs
      - name: Synthetic agent benchmark replay (no provider key)
        run: cargo +stable run --release --locked -p fieldkit-agent --bin fieldkit-agent-benchmark -- --mode replay
      - name: Check entry points
        run: |
          ./target/release/fieldkit doctor
          ./target/release/fieldkit capabilities
          ./target/release/fieldkit tui --help
          ./target/release/fieldkit mcp --help
          ./target/release/fieldkit app --help
          ./target/release/fieldkit nvidia --help
