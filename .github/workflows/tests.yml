name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev
      - name: Native regression tests
        run: make -C native/handlecheck test
      - name: Install Python package and optional integrations
        run: python -m pip install '.[mcp,telegram,tui,dev]'
      - name: Offline unit and MCP protocol tests
        run: python -m unittest discover -s tests -v
      - name: Browser workflow checks
        run: node tests/frontend_test.mjs
      - name: Build wheel and source distribution
        run: python -m build --outdir "$RUNNER_TEMP/fieldkit-dist"
      - name: Reinstall built wheel
        run: python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/fieldkit-dist/*.whl
      - name: Check installed entry points outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          fieldkit doctor
          fieldkit capabilities > fieldkit-capabilities.json
          fieldkit-mcp --help
          fieldkit-tui --help
          fieldkit-app --help
