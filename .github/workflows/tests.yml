name: Rust tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint native runtime
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test collectors and investigation workflows
        run: cargo +stable test --locked
      - name: Browser workflow checks
        run: node tests/frontend_test.mjs
      - name: Build standalone runtime
        run: cargo +stable build --release --locked
      - name: Check entry points
        run: |
          ./target/release/fieldkit doctor
          ./target/release/fieldkit capabilities
          ./target/release/fieldkit tui --help
          ./target/release/fieldkit mcp --help
          ./target/release/fieldkit app --help
