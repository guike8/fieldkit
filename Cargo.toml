[package]
name = "fieldkit"
version = "0.5.0"
edition = "2024"
description = "Evidence-backed OSINT discovery, ontology and terminal investigation workbench"
publish = false
repository = "https://github.com/guike8/fieldkit"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
libc = "0.2"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.42", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
scraper = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
