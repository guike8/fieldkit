[package]
name = "nightjar"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Nightjar native investigation workspace"
publish = false

[dependencies]
anyhow = "1"
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts", "accesskit", "x11"] }
fieldkit = { path = "../.." }
libc = "0.2"
nightjar-brand = { path = "../../crates/nightjar-brand" }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "=0.24.2", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibilityProtocols", "NSApplication", "NSButton", "NSImage", "NSResponder", "NSStatusItem", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSThread"] }
raw-window-handle = "0.6"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
