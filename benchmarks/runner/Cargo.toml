[package]
name = "fieldkit-benchmarks"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "fieldkit-benchmarks"

[[bin]]
name = "benchmark-test-peer"
path = "tests/support/mcp_peer.rs"
test = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.42", features = ["bundled"] }
url = "2"

[dev-dependencies]
tempfile = "3"
